<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Useful Apps - Hidden Gems</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 800px; margin: auto; }
    h1 { text-align: center; color: #333; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 60px; height: 60px; border-radius: 10px; margin-right: 15px; object-fit: cover; }
    .card-content h3 { margin: 0 0 5px 0; color: #2c3e50; }
    .card-content p { margin: 0 0 8px 0; color: #666; font-size: 14px; }
    .btn { background: #28a745; color: white; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-size: 14px; display: inline-block; }
  </style>
</head>
<body>
  <h1>🔥 Top Low-Download & Useful Apps</h1>
  <div id="apps-container">Apps load ho rahi hain...</div>

  <script>
    // Direct fetch with cache-busting timestamp
    var jsonUrl = 'apps.json?v=' + Date.now();
    
    fetch(jsonUrl)
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        var container = document.getElementById('apps-container');
        if (!data || data.length === 0) {
          container.innerHTML = "Koi app nahi mili.";
          return;
        }
        
        var html = '';
        for (var i = 0; i < data.length; i++) {
          var item = data[i];
          html += '<div class="card">' +
                    '<img src="' + (item.icon || '') + '" alt="App Icon">' +
                    '<div class="card-content">' +
                      '<h3>' + (item.title || 'App') + ' (⭐ ' + (item.score || '4.0') + ')</h3>' +
                      '<p>' + (item.description || '') + '</p>' +
                      '<small>Downloads: ' + (item.installs || '100+') + '</small><br><br>' +
                      '<a href="' + (item.url || '#') + '" class="btn" target="_blank">Download App</a>' +
                    '</div>' +
                  '</div>';
        }
        container.innerHTML = html;
      })
      .catch(function(err) {
        document.getElementById('apps-container').innerHTML = "Error loading apps: " + err;
      });
  </script>
</body>
</html>
