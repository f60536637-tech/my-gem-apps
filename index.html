<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Useful Apps - Hidden Gems</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 800px; margin: auto; }
    h1 { text-align: center; color: #333; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 60px; height: 60px; border-radius: 10px; margin-right: 15px; }
    .card-content h3 { margin: 0 0 5px 0; color: #2c3e50; }
    .card-content p { margin: 0 0 8px 0; color: #666; font-size: 14px; }
    .btn { background: #28a745; color: white; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-size: 14px; display: inline-block; }
  </style>
</head>
<body>
  <h1>🔥 Top Low-Download & Useful Apps</h1>
  <div id="apps-container">Apps load ho rahi hain...</div>

  <script>
    // Force fresh fetch every time without caching
    fetch('./apps.json?v=' + Date.now(), { cache: "no-store" })
      .then(response => response.json())
      .then(data => {
        let html = '';
        if(!data || data.length === 0) {
          document.getElementById('apps-container').innerHTML = "Koi app nahi mili.";
          return;
        }
        data.forEach(app => {
          html += `
            <div class="card">
              <img src="${app.icon || ''}" alt="App Icon">
              <div class="card-content">
                <h3>${app.title} (⭐ ${app.score})</h3>
                <p>${app.description}</p>
                <small>Downloads: ${app.installs}</small><br><br>
                <a href="${app.url}" class="btn" target="_blank">Download App</a>
              </div>
            </div>
          `;
        });
        document.getElementById('apps-container').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('apps-container').innerHTML = "Apps load karne me dikkat hui: " + err;
      });
  </script>
</body>
</html>
